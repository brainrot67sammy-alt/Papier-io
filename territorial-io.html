<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Territorial IO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d1a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
canvas.game-active{pointer-events:auto}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#percent{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:26px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#rank{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.6);border-radius:12px;padding:12px 16px;min-width:180px;color:#fff;font-size:13px;line-height:1.6;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
#rank .title{font-weight:700;font-size:12px;margin-bottom:8px;opacity:.7;letter-spacing:1px;text-transform:uppercase}
#rank .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
#rank .row.me{color:#ffe566;font-weight:700}
#rank .dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;box-shadow:0 0 6px currentColor}
#rank .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
#playersOnline{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);border-radius:10px;padding:8px 14px;color:#70a1ff;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.08)}
#controlsHint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:12px;text-align:center}

#overlay{
  position:absolute;inset:0;z-index:9999;pointer-events:auto;
  background:radial-gradient(ellipse at center,rgba(20,20,45,.96) 0%,rgba(8,8,20,.98) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow-y:auto;padding:20px;
}
#overlay.hidden{display:none !important}
#overlay h1{color:#fff;font-size:clamp(28px,7vw,48px);margin-bottom:6px;letter-spacing:3px;text-shadow:0 0 40px rgba(108,92,231,.5)}
#overlay .subtitle{color:#888;font-size:14px;margin-bottom:22px;text-align:center;max-width:360px;line-height:1.5}

.panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px 24px;width:min(380px,94vw)}
.panel label{display:block;color:#bbb;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.panel input[type=text]{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;outline:none;width:100%;margin-bottom:14px}
.panel input[type=text]:focus{border-color:#6c5ce7}

.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.color-opt{width:100%;height:40px;min-height:40px;border-radius:8px;border:3px solid transparent;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:auto;display:block}
.color-opt.selected{border-color:#fff;transform:scale(1.12);box-shadow:0 0 14px rgba(255,255,255,.5)}

.mode-row{display:flex;gap:8px;margin-bottom:14px}
.mode-btn{flex:1;padding:11px 6px;border-radius:10px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#ccc;font-size:13px;font-weight:600;cursor:pointer;pointer-events:auto;position:relative;z-index:2}
.mode-btn.active{border-color:#6c5ce7;background:rgba(108,92,231,.3);color:#fff}

.btn{
  display:block;width:100%;padding:14px 0;margin-top:6px;border:none;border-radius:12px;
  font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;pointer-events:auto;position:relative;z-index:2;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;
  box-shadow:0 6px 22px rgba(108,92,231,.4);
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-ghost{background:rgba(255,255,255,.08);color:#ccc;box-shadow:none;margin-top:10px}
.btn-ghost:hover{background:rgba(255,255,255,.14);color:#fff}

#roomField{display:none;margin-bottom:4px}
#status{color:#aaa;font-size:13px;text-align:center;min-height:18px;margin:8px 0 4px}
#status.err{color:#ff6b6b}
#status.ok{color:#2ed573}

/* Lobby */
#lobby{display:none;width:min(380px,94vw)}
#lobby.show{display:block}
#menu.show{display:block}
#menu.hide{display:none}

.code-frame{
  background:linear-gradient(145deg,rgba(108,92,231,.22),rgba(162,155,254,.08));
  border:2px solid rgba(162,155,254,.55);border-radius:16px;padding:20px 16px;text-align:center;
  box-shadow:0 0 28px rgba(108,92,231,.25);margin-bottom:14px;
}
.code-frame .lbl{color:#a29bfe;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.code-frame .code{color:#fff;font-size:34px;font-weight:800;letter-spacing:7px;cursor:pointer;user-select:all}
.code-frame .hint{color:#888;font-size:12px;margin-top:10px}

.lobby-list{background:rgba(0,0,0,.35);border-radius:12px;padding:12px 14px;margin-bottom:12px;min-height:50px}
.lobby-list .t{color:#888;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.lobby-list .row{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:600;margin:5px 0}
.lobby-list .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.lobby-list .me{color:#ffe566}
#waitMsg{display:none;text-align:center;color:#aaa;font-size:14px;margin:8px 0}
#waitMsg.show{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="playersOnline">● Solo</div>
  <div id="percent">0.0%</div>
  <div id="rank"><div class="title">Ranking</div><div id="rankList"></div></div>
  <div id="controlsHint">WASD / Strzałki / Dotyk • Zamykaj pętle • Przecinaj linie</div>
</div>

<div id="overlay">
  <h1>TERRITORIAL IO</h1>
  <p class="subtitle">Zamykaj pętle śladem, zdobywaj terytorium.<br>Przetnij linię przeciwnika = eliminacja.</p>

  <div class="panel" id="menu">
    <label>Twoje imię</label>
    <input type="text" id="nameInput" maxlength="14" value="Gracz" autocomplete="off" spellcheck="false">

    <label>Kolor kostki</label>
    <div class="color-grid" id="colorGrid">
      <div class="color-opt selected" data-color="#ff4757" style="background:#ff4757"></div>
      <div class="color-opt" data-color="#2ed573" style="background:#2ed573"></div>
      <div class="color-opt" data-color="#1e90ff" style="background:#1e90ff"></div>
      <div class="color-opt" data-color="#ffa502" style="background:#ffa502"></div>
      <div class="color-opt" data-color="#a55eea" style="background:#a55eea"></div>
      <div class="color-opt" data-color="#ff6b81" style="background:#ff6b81"></div>
      <div class="color-opt" data-color="#7bed9f" style="background:#7bed9f"></div>
      <div class="color-opt" data-color="#70a1ff" style="background:#70a1ff"></div>
      <div class="color-opt" data-color="#eccc68" style="background:#eccc68"></div>
      <div class="color-opt" data-color="#ff6348" style="background:#ff6348"></div>
      <div class="color-opt" data-color="#5352ed" style="background:#5352ed"></div>
      <div class="color-opt" data-color="#26de81" style="background:#26de81"></div>
      <div class="color-opt" data-color="#fd79a8" style="background:#fd79a8"></div>
      <div class="color-opt" data-color="#00cec9" style="background:#00cec9"></div>
      <div class="color-opt" data-color="#e17055" style="background:#e17055"></div>
      <div class="color-opt" data-color="#6c5ce7" style="background:#6c5ce7"></div>
    </div>

    <label>Tryb gry</label>
    <div class="mode-row">
      <button type="button" class="mode-btn active" id="btnSolo">Solo + Boty</button>
      <button type="button" class="mode-btn" id="btnHost">Stwórz pokój</button>
      <button type="button" class="mode-btn" id="btnJoin">Dołącz</button>
    </div>

    <div id="roomField">
      <label>Kod pokoju</label>
      <input type="text" id="roomInput" maxlength="8" placeholder="np. AB12XY" autocomplete="off" spellcheck="false" style="text-transform:uppercase;letter-spacing:2px;text-align:center;font-weight:700">
    </div>

    <div id="status"></div>

    <button type="button" class="btn" id="btnStart">START</button>
    <button type="button" class="btn" id="btnCreate" style="display:none">UTWÓRZ POKÓJ</button>
    <button type="button" class="btn" id="btnDoJoin" style="display:none">DOŁĄCZ DO POKOJU</button>
  </div>

  <div id="lobby">
    <div class="code-frame">
      <div class="lbl">Kod pokoju</div>
      <div class="code" id="lobbyCode">————</div>
      <div class="hint">Kliknij kod, aby skopiować • Wyślij znajomym</div>
    </div>
    <div class="lobby-list">
      <div class="t">Gracze w pokoju</div>
      <div id="lobbyPlayers"></div>
    </div>
    <div id="waitMsg">Oczekiwanie na start gry przez hosta…</div>
    <div id="statusL" style="color:#aaa;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px"></div>
    <button type="button" class="btn" id="btnBegin" style="display:none">START GRY</button>
    <button type="button" class="btn btn-ghost" id="btnBack">Wróć do menu</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ========== CONFIG ==========
  var MAP = 2000, CELL = 4, GRID = MAP / CELL;
  var SPEED = 2.85, CUBE = 16, START_SZ = 30, TRAIL_STEP = 3, BOTS = 7, MAX_TRAIL = 1400;
  var COLORS = ['#ff4757','#2ed573','#1e90ff','#ffa502','#a55eea','#ff6b81','#7bed9f','#70a1ff','#eccc68','#ff6348','#5352ed','#26de81','#fd79a8','#00cec9','#e17055','#6c5ce7'];

  // ========== DOM ==========
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var overlay = document.getElementById('overlay');
  var menuEl = document.getElementById('menu');
  var lobbyEl = document.getElementById('lobby');
  var statusEl = document.getElementById('status');
  var statusL = document.getElementById('statusL');

  var W = 0, H = 0, dpr = 1;
  var camera = { x: MAP / 2, y: MAP / 2 };
  var players = [];
  var human = null;
  var keys = {};
  var touchDir = null;
  var running = false;
  var lastTime = 0;
  var animId = 0;
  var selectedColor = COLORS[0];
  var gameMode = 'solo'; // solo | host | join
  var grid = new Uint16Array(GRID * GRID);
  var nextId = 1;

  // multi
  var peer = null;
  var connections = {};
  var myPeerId = null;
  var isHost = false;
  var roomCode = '';
  var inLobby = false;
  var roster = [];

  // ========== UTILS ==========
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function darken(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgb(' + ((((n >> 16) & 255) * f) | 0) + ',' + ((((n >> 8) & 255) * f) | 0) + ',' + (((n & 255) * f) | 0) + ')';
  }
  function lighten(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.min(255, r + (255 - r) * f) | 0;
    g = Math.min(255, g + (255 - g) * f) | 0;
    b = Math.min(255, b + (255 - b) * f) | 0;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function gIdx(gx, gy) { return gy * GRID + gx; }
  function w2g(x, y) { return [(x / CELL) | 0, (y / CELL) | 0]; }
  function isOwn(p, x, y) {
    var g = w2g(x, y);
    if (g[0] < 0 || g[1] < 0 || g[0] >= GRID || g[1] >= GRID) return false;
    return grid[gIdx(g[0], g[1])] === p.id;
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function setStatus(msg, cls) { statusEl.textContent = msg || ''; statusEl.className = cls || ''; }
  function setStatusL(msg, cls) {
    statusL.textContent = msg || '';
    statusL.style.color = cls === 'err' ? '#ff6b6b' : cls === 'ok' ? '#2ed573' : '#aaa';
  }
  function getName() {
    var v = document.getElementById('nameInput').value;
    return (v || 'Gracz').trim().slice(0, 14);
  }

  // ========== DRAW CUBE ==========
  function drawCube(x, y, size, color, dir) {
    var h = size * 0.55, s = size / 2;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 2, s * 1.1, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = darken(color, 0.65);
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x - s, y - h); ctx.lineTo(x, y - h - s * 0.15); ctx.lineTo(x, y - s * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = darken(color, 0.8);
    ctx.beginPath();
    ctx.moveTo(x + s, y); ctx.lineTo(x + s, y - h); ctx.lineTo(x, y - h - s * 0.15); ctx.lineTo(x, y - s * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = lighten(color, 0.15);
    ctx.beginPath();
    ctx.moveTo(x - s, y - h); ctx.lineTo(x, y - h - s * 0.15); ctx.lineTo(x + s, y - h); ctx.lineTo(x, y - h + s * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
    if (dir !== undefined) {
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y - h);
      ctx.lineTo(x + Math.cos(dir) * (s * 0.55), y - h + Math.sin(dir) * (s * 0.35));
      ctx.stroke();
    }
  }

  // ========== PLAYER ==========
  function Player(id, name, color, isBot) {
    this.id = id;
    this.name = name || 'Gracz';
    this.color = color;
    this.isBot = !!isBot;
    this.alive = true;
    this.x = 0; this.y = 0;
    this.dir = 0; this.targetDir = 0;
    this.trail = [];
    this.onTerritory = true;
    this.kills = 0;
    this.territoryCells = 0;
    this.isRemote = false;
    this.peerId = null;
    this.respawn();
  }
  Player.prototype.respawn = function () {
    var tries = 100, sx, sy, free, g, r, dx, dy, nx, ny;
    while (tries--) {
      sx = rand(START_SZ + 50, MAP - START_SZ - 50);
      sy = rand(START_SZ + 50, MAP - START_SZ - 50);
      free = true; g = w2g(sx, sy); r = ((START_SZ / CELL) | 0) + 3;
      for (dy = -r; dy <= r && free; dy++)
        for (dx = -r; dx <= r && free; dx++) {
          nx = g[0] + dx; ny = g[1] + dy;
          if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID && grid[gIdx(nx, ny)] !== 0) free = false;
        }
      if (free) break;
    }
    this.x = sx; this.y = sy;
    this.dir = rand(0, Math.PI * 2); this.targetDir = this.dir;
    this.trail = []; this.onTerritory = true; this.alive = true;
    this.claimStart();
  };
  Player.prototype.claimStart = function () {
    var half = START_SZ;
    var g0 = w2g(this.x - half, this.y - half), g1 = w2g(this.x + half, this.y + half);
    var count = 0, gx, gy, idx;
    for (gy = Math.max(0, g0[1]); gy <= Math.min(GRID - 1, g1[1]); gy++)
      for (gx = Math.max(0, g0[0]); gx <= Math.min(GRID - 1, g1[0]); gx++) {
        idx = gIdx(gx, gy);
        if (grid[idx] === 0 || grid[idx] === this.id) { grid[idx] = this.id; count++; }
      }
    this.territoryCells = count;
  };
  Player.prototype.clearTerritory = function () {
    var i;
    for (i = 0; i < grid.length; i++) if (grid[i] === this.id) grid[i] = 0;
    this.territoryCells = 0;
  };
  Player.prototype.die = function () {
    var self = this;
    if (!this.alive) return;
    this.alive = false;
    this.clearTerritory();
    this.trail = [];
    if (this.isRemote) return;
    setTimeout(function () {
      if (!running) return;
      if (self === human || self.isBot) self.respawn();
    }, this.isBot ? 900 + Math.random() * 1400 : 700);
  };
  Player.prototype.setDir = function (dx, dy) {
    if (dx === 0 && dy === 0) return;
    this.targetDir = Math.atan2(dy, dx);
  };
  Player.prototype.update = function (dt) {
    if (!this.alive || this.isRemote) return;
    var diff = this.targetDir - this.dir;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.dir += clamp(diff, -10 * dt, 10 * dt);
    this.x += Math.cos(this.dir) * SPEED;
    this.y += Math.sin(this.dir) * SPEED;
    if (this.x < 0 || this.y < 0 || this.x > MAP || this.y > MAP) { this.die(); return; }
    var wasOn = this.onTerritory;
    this.onTerritory = isOwn(this, this.x, this.y);
    if (wasOn && !this.onTerritory) this.trail = [{ x: this.x, y: this.y }];
    if (!this.onTerritory) {
      var last = this.trail[this.trail.length - 1];
      if (!last || dist(last.x, last.y, this.x, this.y) >= TRAIL_STEP) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > MAX_TRAIL) this.trail.shift();
      }
      if (this.trail.length > 14) {
        var i;
        for (i = 0; i < this.trail.length - 12; i++) {
          if (dist2(this.x, this.y, this.trail[i].x, this.trail[i].y) < 64) { this.die(); return; }
        }
      }
    }
    if (!wasOn && this.onTerritory && this.trail.length > 5) this.closeLoop();
    if (this.isBot) this.botThink();
  };
  Player.prototype.closeLoop = function () {
    var poly = this.trail.slice();
    poly.push({ x: this.x, y: this.y });
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, i, p;
    for (i = 0; i < poly.length; i++) {
      p = poly[i];
      if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
    }
    var g0 = w2g(minX - CELL, minY - CELL), g1 = w2g(maxX + CELL, maxY + CELL);
    var gx, gy, cx, cy;
    for (gy = Math.max(0, g0[1]); gy <= Math.min(GRID - 1, g1[1]); gy++)
      for (gx = Math.max(0, g0[0]); gx <= Math.min(GRID - 1, g1[0]); gx++) {
        cx = gx * CELL + CELL / 2; cy = gy * CELL + CELL / 2;
        if (pointInPoly(cx, cy, poly)) grid[gIdx(gx, gy)] = this.id;
      }
    recount();
    this.trail = [];
  };
  Player.prototype.botThink = function () {
    var now = performance.now(), self = this;
    if (!this._nt || now > this._nt) {
      this._nt = now + 180 + Math.random() * 380;
      if (this.onTerritory) {
        var bestDx = Math.cos(this.dir), bestDy = Math.sin(this.dir), found = false, o, i, t;
        for (var oi = 0; oi < players.length; oi++) {
          o = players[oi];
          if (o === this || !o.alive || o.onTerritory || o.trail.length < 6) continue;
          for (i = 0; i < o.trail.length; i += 3) {
            t = o.trail[i];
            if (dist(this.x, this.y, t.x, t.y) < 200) { bestDx = t.x - this.x; bestDy = t.y - this.y; found = true; break; }
          }
          if (found) break;
        }
        if (!found) { var a = this.dir + rand(-1.4, 1.4); bestDx = Math.cos(a); bestDy = Math.sin(a); }
        this.setDir(bestDx, bestDy);
      } else {
        var g = w2g(this.x, this.y), tx = this.x, ty = this.y, found2 = false, r, a, nx, ny;
        for (r = 3; r < 45 && !found2; r += 3)
          for (a = 0; a < 10; a++) {
            var ang = (a / 10) * Math.PI * 2 + Math.random();
            nx = (g[0] + Math.cos(ang) * r) | 0; ny = (g[1] + Math.sin(ang) * r) | 0;
            if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID && grid[gIdx(nx, ny)] === this.id) {
              tx = nx * CELL + CELL / 2; ty = ny * CELL + CELL / 2; found2 = true; break;
            }
          }
        if (found2) {
          var tox = tx - this.x, toy = ty - this.y, perp = Math.random() < 0.5 ? 1 : -1;
          this.setDir(tox - toy * 0.5 * perp, toy + tox * 0.5 * perp);
        } else this.setDir(rand(-1, 1), rand(-1, 1));
        for (var oj = 0; oj < players.length; oj++) {
          o = players[oj];
          if (o === this || !o.alive || o.onTerritory) continue;
          for (i = 0; i < o.trail.length; i += 5)
            if (dist(this.x, this.y, o.trail[i].x, o.trail[i].y) < 100) {
              this.setDir(o.trail[i].x - this.x, o.trail[i].y - this.y); break;
            }
        }
      }
    }
    if (!this.onTerritory) {
      var m = 70;
      if (this.x < m) this.setDir(1, rand(-0.4, 0.4));
      if (this.x > MAP - m) this.setDir(-1, rand(-0.4, 0.4));
      if (this.y < m) this.setDir(rand(-0.4, 0.4), 1);
      if (this.y > MAP - m) this.setDir(rand(-0.4, 0.4), -1);
    }
  };

  function pointInPoly(x, y, poly) {
    var inside = false, i, j, xi, yi, xj, yj;
    for (i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      xi = poly[i].x; yi = poly[i].y; xj = poly[j].x; yj = poly[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function recount() {
    var counts = {}, i, id, p;
    for (i = 0; i < players.length; i++) counts[players[i].id] = 0;
    for (i = 0; i < grid.length; i++) {
      id = grid[i];
      if (id && counts[id] !== undefined) counts[id]++;
    }
    for (i = 0; i < players.length; i++) {
      p = players[i];
      p.territoryCells = counts[p.id] || 0;
    }
  }
  function checkKills() {
    var ai, vi, at, v, i;
    for (ai = 0; ai < players.length; ai++) {
      at = players[ai];
      if (!at.alive) continue;
      for (vi = 0; vi < players.length; vi++) {
        v = players[vi];
        if (v === at || !v.alive || v.onTerritory || v.trail.length < 4) continue;
        for (i = 0; i < v.trail.length; i++)
          if (dist2(at.x, at.y, v.trail[i].x, v.trail[i].y) < 81) { at.kills++; v.die(); break; }
      }
    }
  }

  // ========== RENDER ==========
  function render() {
    var focus = (human && human.alive) ? human : null;
    var i;
    if (!focus) for (i = 0; i < players.length; i++) if (players[i].alive) { focus = players[i]; break; }
    if (focus) {
      camera.x += (focus.x - camera.x) * 0.13;
      camera.y += (focus.y - camera.y) * 0.13;
    }
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2 - camera.x, H / 2 - camera.y);
    ctx.fillStyle = '#12122a';
    ctx.fillRect(0, 0, MAP, MAP);
    ctx.strokeStyle = 'rgba(255,255,255,.025)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= MAP; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, MAP); }
    for (var y = 0; y <= MAP; y += 80) { ctx.moveTo(0, y); ctx.lineTo(MAP, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, MAP, MAP);

    var viewL = Math.max(0, ((camera.x - W / 2 - 30) / CELL) | 0);
    var viewT = Math.max(0, ((camera.y - H / 2 - 30) / CELL) | 0);
    var viewR = Math.min(GRID - 1, ((camera.x + W / 2 + 30) / CELL) | 0);
    var viewB = Math.min(GRID - 1, ((camera.y + H / 2 + 30) / CELL) | 0);
    var buckets = {}, p, cells, gx, gy, id;
    for (i = 0; i < players.length; i++) if (players[i].territoryCells > 0) buckets[players[i].id] = [];
    for (gy = viewT; gy <= viewB; gy++)
      for (gx = viewL; gx <= viewR; gx++) {
        id = grid[gIdx(gx, gy)];
        if (id && buckets[id]) buckets[id].push(gx, gy);
      }
    for (i = 0; i < players.length; i++) {
      p = players[i];
      cells = buckets[p.id];
      if (!cells || !cells.length) continue;
      ctx.fillStyle = p.color + '50';
      ctx.beginPath();
      for (var c = 0; c < cells.length; c += 2) ctx.rect(cells[c] * CELL, cells[c + 1] * CELL, CELL + 0.6, CELL + 0.6);
      ctx.fill();
    }
    for (i = 0; i < players.length; i++) {
      p = players[i];
      if (!p.alive || p.trail.length < 2) continue;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = p.color + '33'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(p.trail[0].x, p.trail[0].y);
      for (var t = 1; t < p.trail.length; t++) ctx.lineTo(p.trail[t].x, p.trail[t].y);
      ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = p.color; ctx.lineWidth = 4.5; ctx.stroke();
    }
    var sorted = players.filter(function (pl) { return pl.alive; }).sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < sorted.length; i++) {
      p = sorted[i];
      drawCube(p.x, p.y, CUBE, p.color, p.dir);
      ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
      var tw = ctx.measureText(p.name).width, ny = p.y - CUBE * 0.55 - 18;
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(p.x - tw / 2 - 6, ny - 11, tw + 12, 16);
      ctx.fillStyle = p === human ? '#ffe566' : '#fff';
      ctx.fillText(p.name, p.x, ny);
    }
    ctx.restore();
  }

  function updateUI() {
    if (!human) return;
    var total = GRID * GRID;
    document.getElementById('percent').textContent = (human.territoryCells / total * 100).toFixed(1) + '%';
    var sorted = players.filter(function (p) { return p.alive || p.territoryCells > 0; })
      .slice().sort(function (a, b) { return b.territoryCells - a.territoryCells; });
    var list = document.getElementById('rankList');
    list.innerHTML = '';
    sorted.slice(0, 8).forEach(function (p, i) {
      var row = document.createElement('div');
      row.className = 'row' + (p === human ? ' me' : '');
      var pct = (p.territoryCells / total * 100).toFixed(1);
      row.innerHTML = '<span class="name"><span class="dot" style="background:' + p.color + ';color:' + p.color + '"></span>' + (i + 1) + '. ' + esc(p.name) + '</span><span>' + pct + '%</span>';
      list.appendChild(row);
    });
    var online = document.getElementById('playersOnline');
    if (gameMode === 'solo') {
      online.textContent = '● Solo + Boty';
      online.style.color = '#70a1ff';
    } else {
      var n = players.filter(function (p) { return p.alive && !p.isBot; }).length;
      online.textContent = '● Pokój ' + roomCode + ' · ' + n + ' graczy';
      online.style.color = '#2ed573';
    }
  }

  function loop(ts) {
    if (!running) return;
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    if (human && human.alive) {
      var dx = 0, dy = 0;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (touchDir) { dx = touchDir.x; dy = touchDir.y; }
      if (dx || dy) human.setDir(dx, dy);
    }
    for (var i = 0; i < players.length; i++) players[i].update(dt);
    checkKills();
    if (gameMode !== 'solo' && human && human.alive) broadcastState();
    render();
    updateUI();
    animId = requestAnimationFrame(loop);
  }

  // ========== INPUT ==========
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  var pointerDown = false, pointerOrigin = null;
  function getPos(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointerDown = true; pointerOrigin = getPos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointerDown || !pointerOrigin) return;
    var pos = getPos(e), dx = pos.x - pointerOrigin.x, dy = pos.y - pointerOrigin.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) touchDir = { x: dx, y: dy };
  });
  canvas.addEventListener('pointerup', function () { pointerDown = false; pointerOrigin = null; touchDir = null; });
  canvas.addEventListener('pointercancel', function () { pointerDown = false; pointerOrigin = null; touchDir = null; });

  // ========== MENU ==========
  var colorGrid = document.getElementById('colorGrid');
  (function bindColors() {
    var opts = colorGrid.querySelectorAll('.color-opt');
    for (var i = 0; i < opts.length; i++) {
      (function (el) {
        el.addEventListener('click', function () {
          var all = colorGrid.querySelectorAll('.color-opt');
          for (var j = 0; j < all.length; j++) all[j].classList.remove('selected');
          el.classList.add('selected');
          selectedColor = el.getAttribute('data-color') || selectedColor;
        });
      })(opts[i]);
    }
  })();

  function setMode(m) {
    gameMode = m;
    document.getElementById('btnSolo').classList.toggle('active', m === 'solo');
    document.getElementById('btnHost').classList.toggle('active', m === 'host');
    document.getElementById('btnJoin').classList.toggle('active', m === 'join');
    document.getElementById('btnStart').style.display = m === 'solo' ? 'block' : 'none';
    document.getElementById('btnCreate').style.display = m === 'host' ? 'block' : 'none';
    document.getElementById('btnDoJoin').style.display = m === 'join' ? 'block' : 'none';
    document.getElementById('roomField').style.display = m === 'join' ? 'block' : 'none';
    setStatus('');
  }

  document.getElementById('btnSolo').addEventListener('click', function () { setMode('solo'); });
  document.getElementById('btnHost').addEventListener('click', function () { setMode('host'); });
  document.getElementById('btnJoin').addEventListener('click', function () { setMode('join'); });

  function showLobby() {
    inLobby = true;
    menuEl.classList.add('hide');
    lobbyEl.classList.add('show');
    document.getElementById('lobbyCode').textContent = roomCode;
    document.getElementById('btnBegin').style.display = isHost ? 'block' : 'none';
    document.getElementById('waitMsg').classList.toggle('show', !isHost);
    renderRoster();
  }
  function hideLobby() {
    inLobby = false;
    menuEl.classList.remove('hide');
    lobbyEl.classList.remove('show');
  }
  function renderRoster() {
    var box = document.getElementById('lobbyPlayers');
    box.innerHTML = '';
    roster.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'row' + (r.peerId === myPeerId ? ' me' : '');
      row.innerHTML = '<span class="dot" style="background:' + r.color + '"></span>' +
        esc(r.name) + (r.isHost ? ' (host)' : '') + (r.peerId === myPeerId ? ' — Ty' : '');
      box.appendChild(row);
    });
  }

  document.getElementById('lobbyCode').addEventListener('click', function () {
    if (!roomCode) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(roomCode).then(function () { setStatusL('Kod skopiowany!', 'ok'); }).catch(function () {});
    }
  });

  function genCode() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', i;
    for (i = 0; i < 6; i++) s += chars[(Math.random() * chars.length) | 0];
    return s;
  }

  // ========== PEERJS (loaded on demand) ==========
  function loadPeerJS() {
    return new Promise(function (resolve, reject) {
      if (typeof Peer !== 'undefined') { resolve(); return; }
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('Nie udało się załadować PeerJS (sprawdź internet)')); };
      document.head.appendChild(s);
    });
  }

  function netSend(obj) {
    var raw = JSON.stringify(obj), pid;
    for (pid in connections) {
      if (connections[pid] && connections[pid].open) {
        try { connections[pid].send(raw); } catch (e) {}
      }
    }
  }

  function broadcastState() {
    if (!human) return;
    netSend({
      t: 'u', id: human.id, name: human.name, color: human.color,
      x: Math.round(human.x * 10) / 10, y: Math.round(human.y * 10) / 10,
      d: Math.round(human.dir * 100) / 100, on: human.onTerritory ? 1 : 0,
      trail: human.trail.length ? human.trail.map(function (p) { return [Math.round(p.x), Math.round(p.y)]; }) : [],
      alive: human.alive ? 1 : 0, cells: human.territoryCells
    });
  }

  function broadcastRoster() {
    if (!isHost) return;
    netSend({ t: 'roster', players: roster });
  }

  function handleData(data, fromId) {
    var msg;
    try { msg = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
    if (msg.t === 'join' && isHost && inLobby) {
      var exists = false, i;
      for (i = 0; i < roster.length; i++) if (roster[i].peerId === fromId) exists = true;
      if (!exists) {
        roster.push({ peerId: fromId, name: msg.name, color: msg.color, isHost: false });
        renderRoster();
        broadcastRoster();
        setStatusL('Gracz dołączył!', 'ok');
      }
    } else if (msg.t === 'roster') {
      roster = msg.players || [];
      renderRoster();
    } else if (msg.t === 'start') {
      if (!isHost && inLobby) beginMatch();
    } else if (msg.t === 'u') {
      var p = null, j;
      for (j = 0; j < players.length; j++) {
        if (players[j].peerId === fromId || players[j].id === msg.id) { p = players[j]; break; }
      }
      if (!p) {
        p = new Player(msg.id || (nextId++), msg.name, msg.color, false);
        p.isRemote = true; p.peerId = fromId; p.isBot = false;
        players.push(p);
      }
      p.x = msg.x; p.y = msg.y; p.dir = msg.d; p.onTerritory = !!msg.on;
      p.trail = (msg.trail || []).map(function (t) { return { x: t[0], y: t[1] }; });
      p.alive = !!msg.alive; p.name = msg.name; p.color = msg.color;
      if (typeof msg.cells === 'number') p.territoryCells = msg.cells;
    } else if (msg.t === 'hello') {
      if (inLobby && !isHost) netSend({ t: 'join', name: getName(), color: selectedColor });
      if (running) broadcastState();
    }
  }

  function setupConn(conn) {
    conn.on('open', function () {
      connections[conn.peer] = conn;
      try { conn.send(JSON.stringify({ t: 'hello' })); } catch (e) {}
      if (isHost && inLobby) {
        setTimeout(broadcastRoster, 300);
        setStatusL('Ktoś dołączył!', 'ok');
      }
    });
    conn.on('data', function (d) { handleData(d, conn.peer); });
    conn.on('close', function () {
      delete connections[conn.peer];
      if (inLobby) {
        roster = roster.filter(function (r) { return r.peerId !== conn.peer; });
        renderRoster();
        if (isHost) broadcastRoster();
      }
      if (running) {
        players = players.filter(function (pl) {
          if (pl.peerId === conn.peer) { pl.clearTerritory(); return false; }
          return true;
        });
      }
    });
  }

  function createPeerObj(id) {
    return new Promise(function (resolve, reject) {
      var p = id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 });
      var t = setTimeout(function () {
        try { p.destroy(); } catch (e) {}
        reject(new Error('Timeout – sprawdź internet'));
      }, 14000);
      p.on('open', function () { clearTimeout(t); resolve(p); });
      p.on('error', function (err) {
        clearTimeout(t);
        if (err && err.type === 'unavailable-id') reject(new Error('Kod zajęty – spróbuj ponownie'));
        else reject(err || new Error('Błąd połączenia'));
      });
    });
  }

  // ========== ACTIONS ==========
  function startSolo() {
    try {
      if (animId) cancelAnimationFrame(animId);
      destroyPeer();
      grid.fill(0); players = []; nextId = 1;
      gameMode = 'solo';
      human = new Player(nextId++, getName(), selectedColor, false);
      players.push(human);
      for (var i = 0; i < BOTS; i++)
        players.push(new Player(nextId++, 'Bot ' + (i + 1), COLORS[(i + 3) % COLORS.length], true));
      overlay.classList.add('hidden');
      canvas.classList.add('game-active');
      camera.x = human.x; camera.y = human.y;
      lastTime = performance.now();
      running = true;
      animId = requestAnimationFrame(loop);
    } catch (e) {
      setStatus('Błąd: ' + (e.message || e), 'err');
      console.error(e);
    }
  }

  function beginMatch() {
    if (animId) cancelAnimationFrame(animId);
    grid.fill(0); players = []; nextId = 1;
    human = new Player(nextId++, getName(), selectedColor, false);
    human.peerId = myPeerId;
    players.push(human);
    for (var i = 0; i < roster.length; i++) {
      var r = roster[i];
      if (r.peerId === myPeerId) continue;
      var p = new Player(nextId++, r.name, r.color, false);
      p.isRemote = true; p.peerId = r.peerId; p.isBot = false;
      players.push(p);
    }
    inLobby = false;
    overlay.classList.add('hidden');
    canvas.classList.add('game-active');
    camera.x = human.x; camera.y = human.y;
    lastTime = performance.now();
    running = true;
    animId = requestAnimationFrame(loop);
  }

  function destroyPeer() {
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    connections = {};
    myPeerId = null;
    isHost = false;
    roomCode = '';
    roster = [];
  }

  function leaveLobby() {
    destroyPeer();
    hideLobby();
    setStatus('');
    setMode(gameMode === 'join' ? 'join' : 'host');
  }

  async function createRoom() {
    var btn = document.getElementById('btnCreate');
    btn.disabled = true;
    setStatus('Ładowanie…', '');
    try {
      await loadPeerJS();
      setStatus('Tworzenie pokoju…', '');
      roomCode = genCode();
      peer = await createPeerObj('tio-' + roomCode);
      myPeerId = peer.id;
      isHost = true;
      gameMode = 'host';
      peer.on('connection', function (conn) { setupConn(conn); });
      roster = [{ peerId: myPeerId, name: getName(), color: selectedColor, isHost: true }];
      showLobby();
      setStatusL('Oczekiwanie na graczy…', 'ok');
    } catch (e) {
      setStatus('Błąd: ' + (e.message || e), 'err');
      destroyPeer();
    }
    btn.disabled = false;
  }

  async function joinRoom() {
    var btn = document.getElementById('btnDoJoin');
    btn.disabled = true;
    var code = String(document.getElementById('roomInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    if (code.length < 4) { setStatus('Za krótki kod', 'err'); btn.disabled = false; return; }
    setStatus('Ładowanie…', '');
    try {
      await loadPeerJS();
      setStatus('Łączenie z ' + code + '…', '');
      roomCode = code;
      peer = await createPeerObj();
      myPeerId = peer.id;
      isHost = false;
      gameMode = 'join';
      var conn = peer.connect('tio-' + code, { reliable: true });
      await new Promise(function (resolve, reject) {
        var t = setTimeout(function () { reject(new Error('Nie znaleziono pokoju')); }, 12000);
        conn.on('open', function () { clearTimeout(t); setupConn(conn); resolve(); });
        conn.on('error', function (e) { clearTimeout(t); reject(e); });
        peer.on('error', function (e) { clearTimeout(t); reject(e); });
      });
      netSend({ t: 'join', name: getName(), color: selectedColor });
      roster = [{ peerId: myPeerId, name: getName(), color: selectedColor, isHost: false }];
      showLobby();
      setStatusL('Połączono! Czekaj na start hosta…', 'ok');
    } catch (e) {
      setStatus('Błąd: ' + (e.message || e), 'err');
      destroyPeer();
    }
    btn.disabled = false;
  }

  function hostStart() {
    if (!isHost) return;
    netSend({ t: 'start' });
    beginMatch();
  }

  // ========== WIRE BUTTONS ==========
  document.getElementById('btnStart').addEventListener('click', startSolo);
  document.getElementById('btnCreate').addEventListener('click', createRoom);
  document.getElementById('btnDoJoin').addEventListener('click', joinRoom);
  document.getElementById('btnBegin').addEventListener('click', hostStart);
  document.getElementById('btnBack').addEventListener('click', leaveLobby);

  document.getElementById('nameInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && gameMode === 'solo') startSolo();
  });
  document.getElementById('roomInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') joinRoom();
  });

  setMode('solo');
})();
</script>
</body>
